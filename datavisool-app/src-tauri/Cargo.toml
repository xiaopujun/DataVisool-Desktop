[package]
name = "datavisool-app"
version = "2026.10.0"
description = "DataVisool Desktop"
edition = "2021"
default-run = "datavisool"

[build-dependencies]
tauri-build = { version = "=2.5.6", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.8"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# Biome 0.5.x 的公共 crate 发布版本未完全同步，必须锁在同一版本。
biome_console = "=0.5.7"
biome_diagnostics = "=0.5.7"
biome_json_parser = "=0.5.7"
biome_parser = "=0.5.7"
biome_rowan = "=0.5.7"
biome_text_edit = "=0.5.7"
biome_text_size = "=0.5.7"
biome_unicode_table = "=0.5.7"
serde_path_to_error = "0.1"
json-patch = "3.0.1"
jsonschema = { version = "0.47", default-features = false }
tauri = { version = "=2.10.3", features = ["macos-private-api", "protocol-asset", "devtools"] }
# Tauri 2.10.3's test helpers do not initialize fields added by newer tauri-utils.
tauri-utils = "=2.8.3"
tauri-plugin-dialog = "=2.6.0"
tauri-plugin-shell = "=2.3.4"
sqlx = { version = "0.8.3", features = ["runtime-tokio", "sqlite", "mysql", "postgres", "macros", "migrate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rig-core = { version = "=0.40.0", default-features = false, features = ["reqwest", "rustls"] }
aes = "0.8.4"
base64 = "0.22.1"
block-padding = "0.3.3"
cbc = "0.1.2"
rand = "0.8.5"
rsa = { version = "0.9.8", features = ["pem"] }
urlencoding = "2.1.3"
url = "2"
zip = "2.4.2"
flate2 = "1.0.30"
sha2 = "0.10.8"
cap-std = "=4.0.2"
cap-fs-ext = "=4.0.2"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
resvg = "0.47.0"
datavisool-codec = { path = "../../crates/datavisool-codec" }
datavisool-compat = { path = "../../crates/datavisool-compat" }
datavisool-archive = { path = "../../crates/datavisool-archive" }
datavisool-project-format = { path = "../../crates/datavisool-project-format" }
datavisool-fs = { path = "../../crates/datavisool-fs" }
datavisool-asset = { path = "../../crates/datavisool-asset" }
datavisool-db = { path = "../../crates/datavisool-db" }
datavisool-datasource = { path = "../../crates/datavisool-datasource" }
tracing = "0.1"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4.43"
biome_js_parser = "=0.5.7"
biome_js_syntax = "=0.5.7"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[dev-dependencies]
rig-core = { version = "=0.40.0", default-features = false, features = ["test-utils"] }
tauri = { version = "=2.10.3", features = ["test"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
internal-devtools = ["tauri/devtools"]
desktop-e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[[bin]]
name = "datavisool"
path = "src/main.rs"

# macOS 27 rejects proc-macro dylibs whose LINKEDIT string pool is misaligned
# after rustc strips debuginfo (rust-lang/rust#157750).
[profile.release.package.sqlx-macros]
strip = "none"
