<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataVisool Agent 完整历史</title>
  <style>
    :root {
      color-scheme: dark;
      --accent: #0d9f50;
      --accent-dark: #0a8242;
      --surface: #0f1113;
      --chat: #181b1e;
      --ink: #e6e9eb;
      --muted: #8d9499;
      --line: rgba(255, 255, 255, .08);
      --tool: #263238;
      --reasoning: #2b271b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html { height: 100%; }
    body { margin: 0; min-width: 320px; height: 100vh; height: 100dvh; overflow: hidden; color: var(--ink); background: var(--surface); }
    button, input, textarea { font: inherit; }
    button { border: 0; cursor: pointer; }
    .app { display: grid; grid-template-columns: 286px minmax(0, 1fr); height: 100%; min-height: 0; overflow: hidden; }
    .sidebar { display: flex; flex-direction: column; min-width: 0; background: #111315; border-right: 1px solid var(--line); }
    .brand { height: 72px; display: flex; align-items: center; gap: 11px; padding: 0 20px; border-bottom: 1px solid var(--line); }
    .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; color: #f4f6f7; background: #282c2f; font-weight: 750; letter-spacing: -.5px; }
    .brand-copy strong { display: block; font-size: 14px; }
    .brand-copy span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
    .import-button { margin: 16px 16px 10px; height: 42px; border-radius: 9px; color: white; background: var(--accent); font-weight: 650; transition: transform .16s, background .16s; }
    .import-button:hover { transform: translateY(-1px); background: var(--accent-dark); }
    .session-label { padding: 10px 18px 6px; color: #929292; font-size: 11px; letter-spacing: .08em; }
    .session-list { flex: 1; overflow: auto; padding: 0 8px 16px; }
    .session-item { width: 100%; display: grid; grid-template-columns: 38px 1fr; gap: 10px; padding: 11px 10px; text-align: left; border-radius: 8px; background: transparent; transition: background .16s; }
    .session-item:hover { background: #1d2124; }
    .session-item.active { background: #252a2e; }
    .session-avatar { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 9px; color: #f4f6f7; background: #2b3034; font-size: 11px; font-weight: 750; }
    .session-main { min-width: 0; }
    .session-title, .session-meta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .session-title { margin-top: 1px; font-size: 13px; font-weight: 650; }
    .session-meta { margin-top: 5px; color: var(--muted); font-size: 11px; }
    .sidebar-foot { padding: 12px 17px 16px; color: #999; border-top: 1px solid var(--line); font-size: 10px; line-height: 1.55; }
    .workspace { min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--chat); }
    #historyView { min-width: 0; min-height: 0; flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .toolbar { height: 72px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 16px; padding: 0 24px; border-bottom: 1px solid var(--line); background: rgba(17, 19, 21, .93); backdrop-filter: blur(16px); z-index: 2; }
    .task-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; font-weight: 700; }
    .task-meta { margin-top: 4px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .toolbar-actions { display: flex; align-items: center; gap: 8px; }
    .search { width: min(28vw, 250px); height: 34px; padding: 0 12px; color: var(--ink); border: 1px solid transparent; outline: none; border-radius: 7px; background: #24282c; transition: background .16s, border .16s; }
    .search:focus { background: #2a2f33; border-color: #50575c; }
    .ghost-button { height: 34px; padding: 0 12px; border-radius: 7px; color: #c4c9cc; background: transparent; }
    .ghost-button:hover { background: #24282b; }
    .filter-bar { display: flex; align-items: center; gap: 8px; padding: 10px 24px; border-bottom: 1px solid var(--line); background: rgba(20, 23, 25, .96); overflow-x: auto; }
    .filter { flex: none; padding: 5px 10px; border-radius: 999px; color: #666; background: transparent; font-size: 11px; }
    .filter.active { color: #8bdbae; background: #173a28; font-weight: 650; }
    .stats { margin-left: auto; flex: none; color: #8a8a8a; font-size: 11px; }
    .conversation { min-width: 0; min-height: 0; flex: 1 1 0; overflow-x: hidden; overflow-y: auto; padding: 30px clamp(18px, 5vw, 72px) 90px; scroll-behavior: smooth; scrollbar-color: #4a5054 #1b1e21; scrollbar-width: thin; overscroll-behavior: contain; }
    .conversation::-webkit-scrollbar { width: 10px; }
    .conversation::-webkit-scrollbar-track { background: #1b1e21; }
    .conversation::-webkit-scrollbar-thumb { background: #4a5054; border: 2px solid #1b1e21; border-radius: 999px; }
    .conversation::-webkit-scrollbar-thumb:hover { background: #626a70; }
    .day-divider { display: flex; justify-content: center; margin: 0 0 26px; }
    .day-divider span { padding: 4px 8px; border-radius: 4px; color: #8f969b; background: rgba(255, 255, 255, .06); font-size: 10px; }
    .message { display: flex; align-items: flex-start; gap: 10px; margin: 0 0 22px; animation: arrive .28s both; }
    .message.user { flex-direction: row-reverse; }
    .avatar { flex: 0 0 38px; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 7px; color: #f3f5f6; background: #2c3135; font-size: 11px; font-weight: 750; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
    .message.user .avatar { background: var(--accent); }
    .message.tool .avatar { background: var(--tool); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .message.reasoning .avatar { color: #e7cc79; background: #55491f; }
    .message-body { min-width: 0; max-width: min(720px, calc(100% - 58px)); }
    .sender { margin: 0 0 5px 2px; color: #888; font-size: 10px; }
    .message.user .sender { text-align: right; margin-right: 2px; }
    .bubble { position: relative; padding: 10px 13px; border-radius: 5px; background: #25292c; box-shadow: 0 1px 1px rgba(0, 0, 0, .22); line-height: 1.62; font-size: 13px; overflow-wrap: anywhere; white-space: pre-wrap; }
    .message.user .bubble { background: #0b6438; }
    .bubble::before { content: ""; position: absolute; top: 13px; left: -6px; border-width: 5px 6px 5px 0; border-style: solid; border-color: transparent #25292c transparent transparent; }
    .message.user .bubble::before { left: auto; right: -6px; border-width: 5px 0 5px 6px; border-color: transparent transparent transparent #0b6438; }
    .message.reasoning .bubble { background: var(--reasoning); }
    .message.reasoning .bubble::before { border-right-color: var(--reasoning); }
    .message.tool .bubble { padding: 0; overflow: hidden; background: #202427; border: 1px solid rgba(255, 255, 255, .09); }
    .message.tool .bubble::before { border-right-color: #202427; }
    .tool-head { display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 8px 11px; border-bottom: 1px solid var(--line); }
    .tool-name { min-width: 0; flex: 1; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
    .status { padding: 2px 7px; border-radius: 999px; color: #aeb4b8; background: #30363a; font-size: 9px; text-transform: uppercase; }
    .status.success { color: #89d9ab; background: #173c29; }
    .status.error, .status.denied { color: #f2a6a0; background: #4a2423; }
    details { min-width: 0; }
    summary { cursor: pointer; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    .tool-summary { padding: 8px 11px; color: #747474; font-size: 11px; }
    .tool-details + .tool-details { border-top: 1px solid var(--line); }
    .tool-details[open] .tool-summary { color: #b9c0c4; background: rgba(255, 255, 255, .025); }
    .json { margin: 0; padding: 12px; overflow: auto; color: #d8e1e5; background: #0d1113; font: 11px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; tab-size: 2; }
    .copy { position: absolute; top: 6px; right: 6px; padding: 3px 6px; border-radius: 4px; opacity: 0; color: #c5cbce; background: rgba(8, 10, 11, .82); font-size: 9px; transition: opacity .16s; }
    .bubble:hover .copy { opacity: 1; }
    .system-message { max-width: 760px; margin: 0 auto 26px; color: #717171; text-align: center; font-size: 11px; }
    .system-message summary { display: inline-flex; gap: 7px; padding: 5px 9px; border-radius: 5px; background: rgba(255, 255, 255, .06); }
    .system-content { margin-top: 10px; padding: 12px 14px; text-align: left; border-radius: 7px; background: rgba(255, 255, 255, .045); white-space: pre-wrap; line-height: 1.65; }
    .empty { flex: 1; display: grid; place-items: center; padding: 32px; }
    .drop-zone { width: min(620px, 100%); padding: 72px 34px; text-align: center; border: 1px dashed #4b5257; border-radius: 18px; background: rgba(255, 255, 255, .025); transition: transform .18s, border .18s, background .18s; animation: emptyIn .45s both; }
    .drop-zone.dragging { transform: scale(1.015); border-color: var(--accent); background: rgba(255, 255, 255, .055); }
    .empty-mark { width: 64px; height: 64px; display: grid; place-items: center; margin: 0 auto 22px; border-radius: 18px; color: #f4f6f7; background: #292e31; font-size: 18px; font-weight: 800; }

    .drop-zone h1 { margin: 0; font-size: clamp(22px, 4vw, 34px); letter-spacing: -.04em; }
    .drop-zone p { max-width: 430px; margin: 13px auto 24px; color: #777; line-height: 1.65; font-size: 13px; }
    dialog { width: min(760px, calc(100% - 32px)); padding: 0; color: var(--ink); background: #1b1f22; border: 1px solid rgba(255, 255, 255, .08); border-radius: 14px; box-shadow: 0 24px 80px rgba(0, 0, 0, .55); overflow: hidden; }
    dialog::backdrop { background: rgba(0, 0, 0, .68); backdrop-filter: blur(3px); }
    .dialog-head { display: flex; align-items: center; padding: 17px 19px; border-bottom: 1px solid var(--line); }
    .dialog-head strong { flex: 1; font-size: 15px; }
    .close { width: 30px; height: 30px; border-radius: 50%; color: #aeb4b8; background: #2c3135; }
    .dialog-body { padding: 18px; }
    textarea { width: 100%; height: 330px; resize: vertical; padding: 13px; color: var(--ink); background: #101315; outline: none; border: 1px solid #394045; border-radius: 9px; font: 11px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }
    textarea:focus { border-color: #626b71; }
    .dialog-note { margin-top: 8px; color: #888; font-size: 10px; }
    .dialog-actions { display: flex; align-items: center; gap: 9px; margin-top: 14px; }
    .dialog-actions .spacer { flex: 1; }
    .secondary, .primary { height: 36px; padding: 0 15px; border-radius: 7px; }
    .secondary { color: #cbd0d3; background: #2b3034; }
    .primary { color: white; background: var(--accent); font-weight: 650; }
    .toast { position: fixed; left: 50%; bottom: 24px; z-index: 10; transform: translate(-50%, 20px); padding: 9px 14px; border-radius: 7px; opacity: 0; color: white; background: rgba(20, 20, 20, .9); font-size: 12px; pointer-events: none; transition: opacity .2s, transform .2s; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .hidden { display: none !important; }
    @keyframes arrive { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
    @keyframes emptyIn { from { opacity: 0; transform: translateY(12px) scale(.985); } to { opacity: 1; transform: none; } }
    @media (max-width: 760px) {
      body { height: auto; min-height: 100vh; overflow: auto; }
      .app { display: flex; flex-direction: column; min-height: 100vh; height: auto; overflow: visible; }
      .sidebar { max-height: 210px; border-right: 0; border-bottom: 1px solid var(--line); }
      .brand { height: 58px; }
      .import-button { position: absolute; top: 9px; right: 8px; width: 104px; height: 38px; margin: 0; white-space: nowrap; }
      .session-label, .sidebar-foot { display: none; }
      .session-list { display: flex; padding: 7px 8px 10px; overflow-x: auto; }
      .session-item { flex: 0 0 220px; }
      .workspace { min-height: calc(100vh - 176px); overflow: visible; }
      #historyView { overflow: visible; }
      .toolbar { height: auto; min-height: 64px; padding: 10px 14px; grid-template-columns: 1fr; gap: 8px; }
      .toolbar-actions { width: 100%; }
      .search { flex: 1; width: auto; }
      .filter-bar { padding: 8px 14px; }
      .stats { display: none; }
      .conversation { min-height: 600px; padding: 24px 13px 70px; }
      .message-body { max-width: calc(100% - 50px); }
      .avatar { flex-basis: 34px; width: 34px; height: 34px; }
      .drop-zone { padding: 50px 22px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark logo-mark" role="img" aria-label="DataVisool"></div><div class="brand-copy"><strong>Agent 完整历史</strong><span>任务运行轨迹查看器</span></div></div>
      <button class="import-button" id="openImport">＋ 导入记录</button>
      <div class="session-label">任务记录</div>
      <div class="session-list" id="sessionList"></div>
      <div class="sidebar-foot">数据仅在当前浏览器页面处理，不会上传。<br>支持 .log、.txt 和 .json。</div>
    </aside>
    <section class="workspace">
      <div class="empty" id="emptyState">
        <div class="drop-zone" id="dropZone">
          <div class="empty-mark logo-mark" role="img" aria-label="DataVisool"></div>
          <h1>看清 Agent 的每一步</h1>
          <p>拖入 DEBUG 日志，或粘贴带“完整历史”前缀的记录。系统提示、需求理解、工具调用与返回会按真实顺序呈现。</p>
          <button class="primary" id="emptyImport">导入第一条记录</button>
        </div>
      </div>
      <div class="hidden" id="historyView">
        <header class="toolbar">
          <div><div class="task-title" id="taskTitle"></div><div class="task-meta" id="taskMeta"></div></div>
          <div class="toolbar-actions"><input class="search" id="search" type="search" placeholder="搜索对话 / 方法…"><button class="ghost-button" id="copyJson">复制 JSON</button></div>
        </header>
        <nav class="filter-bar" id="filterBar">
          <button class="filter active" data-filter="all">全部</button>
          <button class="filter" data-filter="user">用户</button>
          <button class="filter" data-filter="assistant">Agent</button>
          <button class="filter" data-filter="reasoning">分析</button>
          <button class="filter" data-filter="tool">方法</button>
          <span class="stats" id="stats"></span>
        </nav>
        <div class="conversation" id="conversation"></div>
      </div>
    </section>
  </main>

  <dialog id="importDialog">
    <div class="dialog-head"><strong>导入 Agent 完整历史</strong><button class="close" id="closeDialog" aria-label="关闭">×</button></div>
    <div class="dialog-body">
      <textarea id="logInput" spellcheck="false" placeholder="粘贴完整 DEBUG 日志、特殊前缀后的 JSON，或直接粘贴 datavisool-agent-history/v1 JSON…"></textarea>
      <div class="dialog-note">可一次粘贴多条记录；查看器会扫描每个“==================完整历史=================”前缀。</div>
      <div class="dialog-actions"><button class="secondary" id="chooseFile">选择文件</button><input class="hidden" id="fileInput" type="file" multiple accept=".log,.txt,.json,application/json,text/plain"><span class="spacer"></span><button class="secondary" id="clearInput">清空</button><button class="primary" id="parseInput">渲染记录</button></div>
    </div>
  </dialog>
  <div class="toast" id="toast"></div>

  <script>
    (() => {
      const PREFIX = "==================完整历史=================";
      const state = { histories: [], selected: -1, filter: "all", query: "" };
      const $ = (id) => document.getElementById(id);
      const els = {
        dialog: $("importDialog"), input: $("logInput"), sessions: $("sessionList"), empty: $("emptyState"),
        view: $("historyView"), conversation: $("conversation"), title: $("taskTitle"), meta: $("taskMeta"),
        stats: $("stats"), search: $("search"), toast: $("toast"), drop: $("dropZone"), file: $("fileInput")
      };

      function toast(message) {
        els.toast.textContent = message;
        els.toast.classList.add("show");
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => els.toast.classList.remove("show"), 1800);
      }

      function balancedObject(text, start) {
        let depth = 0, quoted = false, escaped = false;
        for (let i = start; i < text.length; i += 1) {
          const char = text[i];
          if (quoted) {
            if (escaped) escaped = false;
            else if (char === "\\") escaped = true;
            else if (char === '"') quoted = false;
            continue;
          }
          if (char === '"') quoted = true;
          else if (char === "{") depth += 1;
          else if (char === "}" && --depth === 0) return text.slice(start, i + 1);
        }
        return null;
      }

      function normalizePayload(value) {
        if (typeof value === "string") return normalizePayload(JSON.parse(value));
        if (value && typeof value.history === "string") return normalizePayload(value.history);
        if (!value || typeof value !== "object") throw new Error("记录不是 JSON 对象");
        if (value.schemaVersion !== "datavisool-agent-history/v1" && !Array.isArray(value.messages)) throw new Error("缺少 messages");
        return value;
      }

      function parseHistories(text) {
        const found = [];
        let cursor = 0;
        while ((cursor = text.indexOf(PREFIX, cursor)) !== -1) {
          const start = text.indexOf("{", cursor + PREFIX.length);
          if (start === -1) break;
          const source = balancedObject(text, start);
          if (!source) throw new Error("发现前缀，但后面的 JSON 不完整");
          found.push(normalizePayload(JSON.parse(source)));
          cursor = start + source.length;
        }
        if (found.length) return found;
        const parsed = JSON.parse(text.trim());
        return (Array.isArray(parsed) ? parsed : [parsed]).map(normalizePayload);
      }

      function addHistories(items) {
        const known = new Set(state.histories.map((item) => `${item.runId || ""}:${item.endedAt || ""}`));
        let added = 0;
        items.forEach((item) => {
          const key = `${item.runId || ""}:${item.endedAt || ""}`;
          if (!known.has(key) || !item.runId) { state.histories.push(item); known.add(key); added += 1; }
        });
        if (!state.histories.length) return;
        state.selected = state.histories.length - 1;
        render();
        toast(`已导入 ${added} 条任务记录`);
      }

      function short(value, size = 12) {
        const text = String(value || "未提供");
        return text.length > size ? `${text.slice(0, size)}…` : text;
      }

      function timeLabel(value) {
        if (!value) return "时间未知";
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString("zh-CN", { hour12: false });
      }

      function renderSessions() {
        els.sessions.replaceChildren();
        state.histories.forEach((history, index) => {
          const button = document.createElement("button");
          button.className = `session-item${index === state.selected ? " active" : ""}`;
          const avatar = document.createElement("span");
          avatar.className = "session-avatar";
          avatar.textContent = "AG";
          const main = document.createElement("span");
          main.className = "session-main";
          const title = document.createElement("span");
          title.className = "session-title";
          title.textContent = `任务 ${short(history.taskId)}`;
          const meta = document.createElement("span");
          meta.className = "session-meta";
          meta.textContent = `${history.messageCount ?? history.messages?.length ?? 0} 条消息 · ${timeLabel(history.endedAt)}`;
          main.append(title, meta); button.append(avatar, main);
          button.addEventListener("click", () => { state.selected = index; state.query = ""; els.search.value = ""; render(); });
          els.sessions.append(button);
        });
      }

      function valueText(value) {
        if (typeof value === "string") return value;
        if (value == null) return "";
        return JSON.stringify(value, null, 2);
      }

      function formatted(value) {
        if (typeof value !== "string") return JSON.stringify(value, null, 2);
        try { return JSON.stringify(JSON.parse(value), null, 2); } catch { return value; }
      }

      function contentItems(message) {
        const content = message?.content;
        return Array.isArray(content) ? content : content ? [content] : [];
      }

      function reasoningText(item) {
        const content = item?.content?.content ?? item?.content ?? [];
        const blocks = Array.isArray(content) ? content : [content];
        return blocks.map((block) => {
          if (typeof block === "string") return block;
          const nested = block?.content;
          if (nested && typeof nested === "object") return nested.text || nested.summary || nested.data || valueText(nested);
          return block?.text || block?.summary || block?.data || nested || valueText(block);
        }).filter(Boolean).join("\n");
      }

      function toolResultText(item) {
        const content = Array.isArray(item?.content) ? item.content : [item?.content];
        return content.map((part) => part?.text ?? valueText(part)).filter(Boolean).join("\n");
      }

      function normalizeMessages(history) {
        const rows = [];
        if (history.systemPreamble) rows.push({ type: "system", text: history.systemPreamble, search: history.systemPreamble });
        const executionList = history.toolExecutions || [];
        const executions = new Map();
        const usedExecutions = new Set();
        const renderedExecutions = new Set();
        executionList.forEach((execution) => {
          [execution.toolCallId, execution.internalCallId].filter(Boolean).forEach((id) => executions.set(id, execution));
        });
        function matchExecution(item, name) {
          const ids = [item?.id, item?.call_id, item?.callId, item?.toolCallId].filter(Boolean);
          let execution = ids.map((id) => executions.get(id)).find(Boolean);
          if (!execution) execution = executionList.find((candidate) => !usedExecutions.has(candidate) && candidate.toolName === name);
          if (!execution) execution = executionList.find((candidate) => !usedExecutions.has(candidate));
          if (execution) usedExecutions.add(execution);
          return execution;
        }
        function executionRow(execution, fallback = {}) {
          const name = execution?.toolName || fallback.name || "未知方法";
          const args = execution?.arguments ?? fallback.arguments ?? {};
          const result = execution?.result ?? fallback.result;
          const failure = execution?.failure;
          return {
            type: "tool", mode: "execution", name, status: execution?.outcome || fallback.status || "call",
            arguments: args, result, failure, hasResult: result !== undefined && result !== null,
            search: `${name} ${formatted(args)} ${formatted(result ?? "")} ${failure || ""}`
          };
        }
        (history.messages || []).forEach((message) => {
          const role = String(message.role || "").toLowerCase();
          if (role === "system") {
            rows.push({ type: "system", text: valueText(message.content), search: valueText(message.content) });
            return;
          }
          contentItems(message).forEach((item) => {
            const kind = String(item?.type || item?.kind || "text").toLowerCase();
            const normalizedKind = kind.replace(/[^a-z]/g, "");
            if (normalizedKind === "toolresult" || item?.id && item?.content && role === "user") {
              if (!executionList.length) {
                const result = toolResultText(item);
                rows.push({ type: "tool", mode: "result", name: `返回 ${item.id || ""}`, status: "result", result, hasResult: true, search: formatted(result) });
              }
            } else if (normalizedKind === "toolcall" || item?.function?.name) {
              const fallbackName = item.function?.name || item.name || "未知方法";
              const execution = matchExecution(item, fallbackName);
              if (execution) renderedExecutions.add(execution);
              rows.push(executionRow(execution, {
                name: fallbackName,
                arguments: item.function?.arguments ?? item.arguments ?? {}
              }));
            } else if (kind === "reasoning" || role === "assistant" && Array.isArray(item?.content) && !item?.text && !item?.function) {
              const text = reasoningText(item);
              rows.push({ type: "reasoning", text, search: text });
            } else if (kind === "image") {
              rows.push({ type: role === "assistant" ? "assistant" : "user", text: "[图片内容已省略或脱敏]", search: "图片" });
            } else {
              const text = item?.text ?? valueText(item);
              if (text) rows.push({ type: role === "assistant" ? "assistant" : "user", text, search: text });
            }
          });
        });
        executionList.forEach((execution) => {
          if (!renderedExecutions.has(execution)) rows.push(executionRow(execution));
        });
        return rows;
      }

      function copyButton(text) {
        const button = document.createElement("button");
        button.className = "copy"; button.textContent = "复制";
        button.addEventListener("click", () => navigator.clipboard.writeText(text).then(() => toast("已复制")));
        return button;
      }

      function makeMessage(row, index) {
        if (row.type === "system") {
          const details = document.createElement("details"); details.className = "system-message";
          const summary = document.createElement("summary"); summary.textContent = "系统规则 · 点击展开";
          const content = document.createElement("div"); content.className = "system-content"; content.textContent = row.text;
          details.append(summary, content); details.dataset.kind = "system"; details.dataset.search = row.search.toLowerCase();
          return details;
        }
        const article = document.createElement("article");
        article.className = `message ${row.type}`; article.style.animationDelay = `${Math.min(index * 18, 220)}ms`;
        article.dataset.kind = row.type; article.dataset.search = String(row.search || "").toLowerCase();
        const avatar = document.createElement("div"); avatar.className = "avatar";
        avatar.textContent = row.type === "user" ? "我" : row.type === "tool" ? "</>" : row.type === "reasoning" ? "思" : "";
        if (row.type !== "user" && row.type !== "tool" && row.type !== "reasoning") { avatar.classList.add("logo-mark"); avatar.setAttribute("aria-label", "DataVisool"); }
        const body = document.createElement("div"); body.className = "message-body";
        const sender = document.createElement("div"); sender.className = "sender";
        sender.textContent = row.type === "user" ? "用户" : row.type === "tool" ? "方法执行" : row.type === "reasoning" ? "Agent 分析" : "DataVisool Agent";
        const bubble = document.createElement("div"); bubble.className = "bubble";
        if (row.type === "tool") {
          const head = document.createElement("div"); head.className = "tool-head";
          const name = document.createElement("span"); name.className = "tool-name"; name.textContent = row.name;
          const statusLabels = { success: "成功", error: "失败", denied: "拒绝", skipped: "跳过", result: "返回" };
          const status = document.createElement("span"); status.className = `status ${row.status || ""}`; status.textContent = row.mode === "call" ? "调用" : statusLabels[row.status] || row.status || "返回";
          head.append(name, status);
          bubble.append(head);
          if (row.mode === "result") {
            const resultDetails = document.createElement("details"); resultDetails.className = "tool-details";
            const resultSummary = document.createElement("summary"); resultSummary.className = "tool-summary"; resultSummary.textContent = "查看返回内容";
            const resultPre = document.createElement("pre"); resultPre.className = "json"; resultPre.textContent = formatted(row.result);
            resultDetails.append(resultSummary, resultPre); bubble.append(resultDetails, copyButton(formatted(row.result)));
          } else {
            const argsDetails = document.createElement("details"); argsDetails.className = "tool-details";
            const argsSummary = document.createElement("summary"); argsSummary.className = "tool-summary"; argsSummary.textContent = "查看调用参数";
            const argsPre = document.createElement("pre"); argsPre.className = "json"; argsPre.textContent = formatted(row.arguments);
            argsDetails.append(argsSummary, argsPre); bubble.append(argsDetails);
            const resultDetails = document.createElement("details"); resultDetails.className = "tool-details";
            const resultSummary = document.createElement("summary"); resultSummary.className = "tool-summary";
            resultSummary.textContent = row.hasResult ? "查看返回内容" : "未记录返回内容";
            const resultPre = document.createElement("pre"); resultPre.className = "json";
            resultPre.textContent = row.hasResult ? formatted(row.result) : (row.failure || "本次日志中没有方法返回值");
            resultDetails.append(resultSummary, resultPre); bubble.append(resultDetails);
            bubble.append(copyButton(formatted({ arguments: row.arguments, result: row.result, failure: row.failure })));
          }
        } else {
          bubble.textContent = row.text; bubble.append(copyButton(row.text));
        }
        body.append(sender, bubble); article.append(avatar, body); return article;
      }

      function applyFilters() {
        const query = state.query.trim().toLowerCase();
        els.conversation.querySelectorAll("[data-kind]").forEach((node) => {
          const kind = node.dataset.kind;
          const roleMatches = state.filter === "all" || kind === state.filter || state.filter === "assistant" && kind === "reasoning";
          node.classList.toggle("hidden", !roleMatches || query && !node.dataset.search.includes(query));
        });
      }

      function renderHistory() {
        const history = state.histories[state.selected];
        if (!history) return;
        const rows = normalizeMessages(history);
        const reasoningCount = rows.filter((row) => row.type === "reasoning").length;
        els.title.textContent = `任务 ${history.taskId || history.turnId || "未命名"}`;
        els.meta.textContent = `Run ${short(history.runId, 18)} · ${timeLabel(history.endedAt)}`;
        els.stats.textContent = `${rows.filter((row) => row.type !== "system").length} 条 · ${history.toolExecutionCount ?? history.toolExecutions?.length ?? 0} 次方法 · ${reasoningCount} 段分析`;
        els.conversation.replaceChildren();
        const divider = document.createElement("div"); divider.className = "day-divider";
        const dividerText = document.createElement("span"); dividerText.textContent = timeLabel(history.endedAt); divider.append(dividerText);
        els.conversation.append(divider, ...rows.map(makeMessage));
        applyFilters(); els.conversation.scrollTop = 0;
      }

      function render() {
        const hasHistory = state.histories.length > 0;
        els.empty.classList.toggle("hidden", hasHistory); els.view.classList.toggle("hidden", !hasHistory);
        renderSessions(); if (hasHistory) renderHistory();
      }

      async function loadFiles(files) {
        try {
          const texts = await Promise.all(Array.from(files).map((file) => file.text()));
          addHistories(texts.flatMap(parseHistories)); els.dialog.close();
        } catch (error) { toast(`导入失败：${error.message}`); }
      }

      function openDialog() { els.dialog.showModal(); setTimeout(() => els.input.focus(), 60); }
      $("openImport").addEventListener("click", openDialog); $("emptyImport").addEventListener("click", openDialog);
      $("closeDialog").addEventListener("click", () => els.dialog.close());
      $("chooseFile").addEventListener("click", () => els.file.click()); els.file.addEventListener("change", () => loadFiles(els.file.files));
      $("clearInput").addEventListener("click", () => { els.input.value = ""; els.input.focus(); });
      $("parseInput").addEventListener("click", () => {
        try { addHistories(parseHistories(els.input.value)); els.dialog.close(); }
        catch (error) { toast(`解析失败：${error.message}`); }
      });
      $("copyJson").addEventListener("click", () => {
        const history = state.histories[state.selected];
        if (history) navigator.clipboard.writeText(`${PREFIX}${JSON.stringify(history)}`).then(() => toast("完整历史已复制"));
      });
      els.search.addEventListener("input", () => { state.query = els.search.value; applyFilters(); });
      $("filterBar").addEventListener("click", (event) => {
        const button = event.target.closest("[data-filter]"); if (!button) return;
        state.filter = button.dataset.filter;
        document.querySelectorAll(".filter").forEach((node) => node.classList.toggle("active", node === button)); applyFilters();
      });
      ["dragenter", "dragover"].forEach((type) => document.addEventListener(type, (event) => { event.preventDefault(); els.drop.classList.add("dragging"); }));
      ["dragleave", "drop"].forEach((type) => document.addEventListener(type, (event) => { event.preventDefault(); els.drop.classList.remove("dragging"); }));
      document.addEventListener("drop", (event) => { if (event.dataTransfer.files.length) loadFiles(event.dataTransfer.files); });
      document.addEventListener("keydown", (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "o") { event.preventDefault(); openDialog(); }
        if (event.key === "/" && !els.dialog.open && document.activeElement !== els.search) { event.preventDefault(); els.search.focus(); }
      });
      render();
    })();
  </script>
</body>
</html>
